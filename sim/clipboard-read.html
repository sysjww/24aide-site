<!doctype html><html><head><meta charset="utf-8"><title>clip</title></head><body>
<button id="b" style="font-size:32px;padding:20px">READ CLIPBOARD</button>
<pre id="r" style="font-size:24px;word-break:break-all"></pre>
<script>
document.getElementById('b').onclick = async () => {
  try { const t = await navigator.clipboard.readText(); document.getElementById('r').textContent = t || '(empty)'; }
  catch (e) { document.getElementById('r').textContent = 'ERR: ' + e.name + ' ' + e.message; }
};
</script>
</body></html>
